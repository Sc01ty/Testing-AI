# Builds RAP BUT RANKED (rap-but-ranked/) and publishes it to GitHub Pages
# on every push to main: https://sc01ty.github.io/Testing-AI/
#
# One-time setup on GitHub: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy Rap But Ranked

on:
  push:
    branches: [main]
    paths:
      - 'rap-but-ranked/**'
      - '.github/workflows/deploy-rap-but-ranked.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rap-but-ranked
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rap-but-ranked/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rap-but-ranked/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
