# Check the existing app. Production is deployed to the Scotty Systems PHP host;
# GitHub Pages cannot run its room API and is not a second production target.
name: Check Rap But Ranked

on:
  push:
    branches: [main]
    paths:
      - 'rap-but-ranked/**'
      - '.github/workflows/deploy-rap-but-ranked.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces queued checks.
concurrency:
  group: rap-checks
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rap-but-ranked
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rap-but-ranked/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: rap-but-ranked-build
          path: rap-but-ranked/dist
          retention-days: 7
